name: CI
on: [push, pull_request]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # PostgreSQL och Redis behövs för integrationstesterna (CI-testet går inte igenom utan databasen)
    services:
      db:
        image: postgres:16
        env:
          # testuppgifter för PostgreSQL i CI
          POSTGRES_DB: jensen_iot
          POSTGRES_USER: student
          POSTGRES_PASSWORD: student
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements.txt
      # initierar testdatabasen med tabeller och testsensorer
      - run: |
          PGPASSWORD=student psql -h localhost -U student -d jensen_iot -f database/init.sql
      - run: python -m pytest tests -q
        working-directory: api
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: jensen_iot
          DB_USER: student
          DB_PASSWORD: student
          REDIS_HOST: localhost
          REDIS_PORT: 6379
      - run: docker build -t jensen-iot-api:ci ./api